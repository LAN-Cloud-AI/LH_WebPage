<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">三层线索池，连接组织与销售</title><desc id="desc">从数据归属到组织指派，再到账号分发，让承接路径清晰可见。</desc><defs><linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142F48"/><stop offset="1" stop-color="#20516C"/></linearGradient><linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9F8F5"/><stop offset="1" stop-color="#EAF4FC"/></linearGradient></defs><g font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1400" height="850" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1"/><rect x="64" y="48" width="6" height="25" rx="3" fill="#13A6A2" stroke="none" stroke-width="1"/><text x="85" y="69" font-size="22" font-weight="600" fill="#13A6A2" text-anchor="start">线索猎手 · 分发机制</text><text x="64" y="134" font-size="44" font-weight="650" fill="#142F48" text-anchor="start">三层线索池，连接组织与销售</text><text x="64" y="180" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">从数据归属到组织指派，再到账号分发，让承接路径清晰可见。</text><line x1="64" y1="207" x2="1336" y2="207" stroke="#DAE6EC" stroke-width="2" /><rect x="64" y="248" width="300" height="290" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="88" y="272" width="65" height="65" rx="19" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(99 282) scale(0.9)"><path d="M 3 9 L 47 9 L 41 43 L 9 43 Z" fill="none" stroke="#237BDA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="7" y1="22" x2="43" y2="22" stroke="#237BDA" stroke-width="2.4" /><circle cx="17" cy="32" r="2.5" fill="#237BDA" stroke="none" stroke-width="1"/><circle cx="25" cy="32" r="2.5" fill="#237BDA" stroke="none" stroke-width="1"/><circle cx="33" cy="32" r="2.5" fill="#237BDA" stroke="none" stroke-width="1"/></g><text x="338" y="307" font-size="27" font-weight="650" fill="#237BDA" text-anchor="end">01</text><text x="88" y="386" font-size="32" font-weight="650" fill="#142F48" text-anchor="start">归属池</text><text x="88" y="441" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">线索的归属范围</text><text x="88" y="482" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">集中查看归属线索</text><circle cx="376" cy="393" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 371 386 L 379 393 L 371 400" fill="none" stroke="#237BDA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="388" y="248" width="300" height="290" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="412" y="272" width="65" height="65" rx="19" fill="#E8F6F2" stroke="none" stroke-width="1"/><g transform="translate(423 282) scale(0.9)"><rect x="16" y="0" width="18" height="13" rx="3" fill="none" stroke="#13A6A2" stroke-width="2.5"/><rect x="0" y="35" width="16" height="13" rx="3" fill="none" stroke="#13A6A2" stroke-width="2.5"/><rect x="34" y="35" width="16" height="13" rx="3" fill="none" stroke="#13A6A2" stroke-width="2.5"/><path d="M 25 13 L 25 24 M 8 35 L 8 24 L 42 24 L 42 35" fill="none" stroke="#13A6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="662" y="307" font-size="27" font-weight="650" fill="#13A6A2" text-anchor="end">02</text><text x="412" y="386" font-size="32" font-weight="650" fill="#142F48" text-anchor="start">组织指派池</text><text x="412" y="441" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">面向门店 / 组织</text><text x="412" y="482" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">按配额指派线索</text><circle cx="700" cy="393" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 695 386 L 703 393 L 695 400" fill="none" stroke="#13A6A2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="712" y="248" width="300" height="290" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="736" y="272" width="65" height="65" rx="19" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(747 282) scale(0.9)"><circle cx="25" cy="12" r="10" fill="none" stroke="#237BDA" stroke-width="2.8"/><path d="M 5 47 L 5 41 C 5 21 45 21 45 41 L 45 47" fill="none" stroke="#237BDA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="986" y="307" font-size="27" font-weight="650" fill="#237BDA" text-anchor="end">03</text><text x="736" y="386" font-size="32" font-weight="650" fill="#142F48" text-anchor="start">账号分发池</text><text x="736" y="441" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">面向销售账号</text><text x="736" y="482" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">分配给具体销售</text><circle cx="1024" cy="393" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 1019 386 L 1027 393 L 1019 400" fill="none" stroke="#237BDA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="1036" y="248" width="300" height="290" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="1060" y="272" width="65" height="65" rx="19" fill="#E8F6F2" stroke="none" stroke-width="1"/><g transform="translate(1071 282) scale(0.9)"><rect x="11" y="1" width="28" height="48" rx="5" fill="none" stroke="#13A6A2" stroke-width="2.8"/><line x1="21" y1="7" x2="29" y2="7" stroke="#13A6A2" stroke-width="2.8" /><circle cx="25" cy="43" r="1.8" fill="#13A6A2" stroke="none" stroke-width="1"/><path d="M 17 25 L 23 31 L 34 18" fill="none" stroke="#13A6A2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1310" y="307" font-size="27" font-weight="650" fill="#13A6A2" text-anchor="end">04</text><text x="1060" y="386" font-size="32" font-weight="650" fill="#142F48" text-anchor="start">APP</text><text x="1060" y="441" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">销售日常工作入口</text><text x="1060" y="482" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">查看、沟通与跟进</text><text x="64" y="599" font-size="27" font-weight="650" fill="#142F48" text-anchor="start">分发时需要理解的 3 个规则</text><rect x="64" y="627" width="408" height="168" rx="22" fill="#EAF3FE" stroke="none" stroke-width="1"/><rect x="86" y="646" width="78" height="42" rx="21" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="125.0" y="675" font-size="22" font-weight="600" fill="#237BDA" text-anchor="middle">共享</text><text x="86" y="720" font-size="27" font-weight="600" fill="#142F48" text-anchor="start">同一条线索</text><text x="86" y="759" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">可以向多个组织共享</text><rect x="496" y="627" width="408" height="168" rx="22" fill="#E8F6F2" stroke="none" stroke-width="1"/><rect x="518" y="646" width="78" height="42" rx="21" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="557.0" y="675" font-size="22" font-weight="600" fill="#13A6A2" text-anchor="middle">配额</text><text x="518" y="720" font-size="27" font-weight="600" fill="#142F48" text-anchor="start">组织按配额</text><text x="518" y="759" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">承接对应的指派线索</text><rect x="928" y="627" width="408" height="168" rx="22" fill="#EAF3FE" stroke="none" stroke-width="1"/><rect x="950" y="646" width="78" height="42" rx="21" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="989.0" y="675" font-size="22" font-weight="600" fill="#237BDA" text-anchor="middle">可见</text><text x="950" y="720" font-size="27" font-weight="600" fill="#142F48" text-anchor="start">销售仅查看</text><text x="950" y="759" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">分给自己的有效线索</text></g></svg>