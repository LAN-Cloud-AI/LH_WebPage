<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">长沙小鹏直营：一个月使用成果</title><desc id="desc">长沙小鹏直营一个月：174条跟进记录，62条客户回复，36条取得联系方式，其中23条取得手机号；销售反馈3条锁单。</desc><g font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1400" height="940" rx="0" fill="#F8F7F2" stroke="none" /><rect x="64" y="48" width="6" height="25" rx="3" fill="#13A6A2" stroke="none" /><text x="85" y="69" font-size="22" fill="#13A6A2" font-weight="600" text-anchor="start">线索猎手 · 合作伙伴使用成果</text><text x="64" y="134" font-size="42" fill="#142F48" font-weight="650" text-anchor="start">从销售跟进，到真实回复与留资</text><text x="64" y="180" font-size="25" fill="#5E7587" font-weight="400" text-anchor="start">长沙小鹏直营 · 2 家门店 · 4 位销售 · 一个月跟进成果</text><line x1="64" y1="207" x2="1336" y2="207" stroke="#DAE6EC" stroke-width="2" /><rect x="64" y="233" width="300" height="175" rx="22" fill="#FFF" stroke="#DAE6EC" /><text x="87" y="271" font-size="22" fill="#5E7587" font-weight="550" text-anchor="start">销售跟进记录</text><text x="87" y="340" font-size="60" fill="#142F48" font-weight="700" text-anchor="start">174</text><text x="208" y="337" font-size="25" fill="#142F48" font-weight="500" text-anchor="start">条</text><text x="87" y="380" font-size="20" fill="#5E7587" font-weight="400" text-anchor="start">覆盖 2 家直营门店</text><rect x="388" y="233" width="300" height="175" rx="22" fill="#FFF" stroke="#DAE6EC" /><text x="411" y="271" font-size="22" fill="#5E7587" font-weight="550" text-anchor="start">客户回复</text><text x="411" y="340" font-size="60" fill="#237BDA" font-weight="700" text-anchor="start">62</text><text x="532" y="337" font-size="25" fill="#237BDA" font-weight="500" text-anchor="start">条</text><text x="411" y="380" font-size="20" fill="#5E7587" font-weight="400" text-anchor="start">占全部跟进记录的 35.6%</text><rect x="712" y="233" width="300" height="175" rx="22" fill="#FFF" stroke="#DAE6EC" /><t