<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">从公域需求，到门店跟进</title><desc id="desc">发现需求、判断价值、有序交付，再由销售回到原平台沟通。</desc><defs><linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142F48"/><stop offset="1" stop-color="#20516C"/></linearGradient><linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9F8F5"/><stop offset="1" stop-color="#EAF4FC"/></linearGradient></defs><g font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1400" height="800" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1"/><rect x="64" y="48" width="6" height="25" rx="3" fill="#13A6A2" stroke="none" stroke-width="1"/><text x="85" y="69" font-size="22" font-weight="600" fill="#13A6A2" text-anchor="start">线索猎手 · 工作链路</text><text x="64" y="134" font-size="44" font-weight="650" fill="#142F48" text-anchor="start">从公域需求，到门店跟进</text><text x="64" y="180" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">发现需求、判断价值、有序交付，再由销售回到原平台沟通。</text><line x1="64" y1="207" x2="1336" y2="207" stroke="#DAE6EC" stroke-width="2" /><text x="64" y="261" font-size="24" font-weight="600" fill="#5E7587" text-anchor="start">公开渠道</text><rect x="204" y="231" width="110" height="42" rx="21" fill="#EAF3FE" stroke="none" stroke-width="1"/><text x="259.0" y="260" font-size="23" font-weight="600" fill="#237BDA" text-anchor="middle">抖音</text><rect x="330" y="231" width="140" height="42" rx="21" fill="#E6F5F2" stroke="none" stroke-width="1"/><text x="400.0" y="260" font-size="23" font-weight="600" fill="#13A6A2" text-anchor="middle">小红书</text><rect x="486" y="231" width="140" height="42" rx="21" fill="#EAF3FE" stroke="none" stroke-width="1"/><text x="556.0" y="260" font-size="23" font-weight="600" fill="#237BDA" text-anchor="middle">TikTok</text><text x="662" y="244" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">帖子组仅支持小红书</text><text x="662" y="281" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">TikTok 采集及海外交付按项目配置</text><rect x="64" y="308" width="300" height="320" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="86" y="330" width="72" height="72" rx="20" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(98 342) scale(1)"><circle cx="22" cy="22" r="15" fill="none" stroke="#237BDA" stroke-width="3"/><path d="M 34 34 L 45 45" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M 14 23 L 21 29 L 31 16" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="335" y="365" font-size="27" font-weight="700" fill="#237BDA" text-anchor="end">01</text><text x="88" y="444" font-size="24" font-weight="500" fill="#5E7587" text-anchor="start">发现需求</text><text x="88" y="490" font-size="30" font-weight="650" fill="#142F48" text-anchor="start">公域需求发现</text><text x="88" y="544" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">从公开评论、帖子中</text><text x="88" y="582" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">发现潜在购车需求</text><circle cx="376" cy="465" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 371 458 L 379 465 L 371 472" fill="none" stroke="#237BDA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="388" y="308" width="300" height="320" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="410" y="330" width="72" height="72" rx="20" fill="#E8F6F2" stroke="none" stroke-width="1"/><g transform="translate(422 342) scale(1)"><path d="M 25 3 L 31 19 L 47 25 L 31 31 L 25 47 L 19 31 L 3 25 L 19 19 Z" fill="none" stroke="#13A6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 44 0 L 44 9 M 40 4.5 L 48 4.5" fill="none" stroke="#13A6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="659" y="365" font-size="27" font-weight="700" fill="#13A6A2" text-anchor="end">02</text><text x="412" y="444" font-size="24" font-weight="500" fill="#5E7587" text-anchor="start">理解意向</text><text x="412" y="490" font-size="30" font-weight="650" fill="#142F48" text-anchor="start">AI 判断</text><text x="412" y="544" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">辅助识别需求内容</text><text x="412" y="582" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">帮助筛选值得跟进的线索</text><circle cx="700" cy="465" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 695 458 L 703 465 L 695 472" fill="none" stroke="#13A6A2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="712" y="308" width="300" height="320" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="734" y="330" width="72" height="72" rx="20" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(746 342) scale(1)"><path d="M 6 22 L 6 45 L 44 45 L 44 22 M 3 22 L 9 6 L 41 6 L 47 22 Z M 17 45 L 17 30 L 31 30 L 31 45 M 13 6 L 10 22 M 25 6 L 25 22 M 37 6 L 40 22" fill="none" stroke="#237BDA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="983" y="365" font-size="27" font-weight="700" fill="#237BDA" text-anchor="end">03</text><text x="736" y="444" font-size="24" font-weight="500" fill="#5E7587" text-anchor="start">分配承接</text><text x="736" y="490" font-size="30" font-weight="650" fill="#142F48" text-anchor="start">门店 / 销售交付</text><text x="736" y="544" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">按组织与账号分配</text><text x="736" y="582" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">让线索进入销售工作台</text><circle cx="1024" cy="465" r="16" fill="#F8F7F2" stroke="none" stroke-width="1"/><path d="M 1019 458 L 1027 465 L 1019 472" fill="none" stroke="#237BDA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><rect x="1036" y="308" width="300" height="320" rx="24" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="1058" y="330" width="72" height="72" rx="20" fill="#E8F6F2" stroke="none" stroke-width="1"/><g transform="translate(1070 342) scale(1)"><rect x="11" y="1" width="28" height="48" rx="5" fill="none" stroke="#13A6A2" stroke-width="2.8"/><line x1="21" y1="7" x2="29" y2="7" stroke="#13A6A2" stroke-width="2.8" /><circle cx="25" cy="43" r="1.8" fill="#13A6A2" stroke="none" stroke-width="1"/><path d="M 17 25 L 23 31 L 34 18" fill="none" stroke="#13A6A2" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1307" y="365" font-size="27" font-weight="700" fill="#13A6A2" text-anchor="end">04</text><text x="1060" y="444" font-size="24" font-weight="500" fill="#5E7587" text-anchor="start">展开沟通</text><text x="1060" y="490" font-size="30" font-weight="650" fill="#142F48" text-anchor="start">APP 跟进</text><text x="1060" y="544" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">销售查看分配的线索</text><text x="1060" y="582" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">回到原平台联系用户</text><rect x="64" y="671" width="1272" height="80" rx="22" fill="url(#navyGrad)" stroke="none" stroke-width="1"/><text x="700" y="721" font-size="29" font-weight="550" fill="#FFFFFF" text-anchor="middle">把分散的需求信号，转化为门店可承接的跟进机会。</text></g></svg>