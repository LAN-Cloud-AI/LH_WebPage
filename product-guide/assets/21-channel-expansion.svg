<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">为门店增加一条需求发现路径</title><desc id="desc">垂直媒体承接主动留资；线索猎手补充社交公域中的需求发现。</desc><defs><linearGradient id="navyGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#142F48"/><stop offset="1" stop-color="#20516C"/></linearGradient><linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9F8F5"/><stop offset="1" stop-color="#EAF4FC"/></linearGradient></defs><g font-family="PingFang SC, Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1400" height="850" rx="0" fill="#F8F7F2" stroke="none" stroke-width="1"/><rect x="64" y="48" width="6" height="25" rx="3" fill="#13A6A2" stroke="none" stroke-width="1"/><text x="85" y="69" font-size="22" font-weight="600" fill="#13A6A2" text-anchor="start">线索猎手 · 渠道互补</text><text x="64" y="134" font-size="44" font-weight="650" fill="#142F48" text-anchor="start">为门店增加一条需求发现路径</text><text x="64" y="180" font-size="26" font-weight="400" fill="#5E7587" text-anchor="start">垂直媒体承接主动留资；线索猎手补充社交公域中的需求发现。</text><line x1="64" y1="207" x2="1336" y2="207" stroke="#DAE6EC" stroke-width="2" /><rect x="64" y="236" width="204" height="42" rx="21" fill="#EAF3FE" stroke="none" stroke-width="1"/><text x="166.0" y="265" font-size="24" font-weight="600" fill="#237BDA" text-anchor="middle">已有的留资入口</text><text x="293" y="266" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">用户主动提交联系方式后，进入邀约流程</text><rect x="64" y="300" width="282" height="162" rx="22" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="84" y="323" width="55" height="55" rx="16" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(93 331) scale(0.76)"><circle cx="22" cy="22" r="15" fill="none" stroke="#237BDA" stroke-width="3"/><path d="M 34 34 L 45 45" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M 14 23 L 21 29 L 31 16" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="154" y="361" font-size="29" font-weight="650" fill="#142F48" text-anchor="start">垂直媒体</text><text x="88" y="419" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">汽车垂媒等渠道</text><line x1="353" y1="380" x2="381" y2="380" stroke="#237BDA" stroke-width="3" /><path d="M 372 373 L 381 380 L 372 387" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="394" y="300" width="282" height="162" rx="22" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="414" y="323" width="55" height="55" rx="16" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(423 331) scale(0.76)"><circle cx="25" cy="12" r="10" fill="none" stroke="#237BDA" stroke-width="2.8"/><path d="M 5 47 L 5 41 C 5 21 45 21 45 41 L 45 47" fill="none" stroke="#237BDA" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /></g><text x="484" y="361" font-size="29" font-weight="650" fill="#142F48" text-anchor="start">主动留资</text><text x="418" y="419" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">用户提交信息</text><line x1="683" y1="380" x2="711" y2="380" stroke="#237BDA" stroke-width="3" /><path d="M 702 373 L 711 380 L 702 387" fill="none" stroke="#237BDA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="724" y="300" width="282" height="162" rx="22" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="744" y="323" width="55" height="55" rx="16" fill="#EAF3FE" stroke="none" stroke-width="1"/><g transform="translate(753 331) scale(0.76)"><path d="M 5 5 L 45 5 L 45 35 L 25 35 L 12 46 L 12 35 L 5 35 Z" fill="none" stroke="#237BDA" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><line x1="13" y1="15" x2="37" y2="15" stroke="#237BDA" stroke-width="2.7" /><line x1="13" y1="24" x2="29" y2="24" stroke="#237BDA"