"1041" y2="628" stroke="#13A6A2" stroke-width="3" /><path d="M 1032 621 L 1041 628 L 1032 635" fill="none" stroke="#13A6A2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="1054" y="548" width="282" height="162" rx="22" fill="#FFFFFF" stroke="#DAE6EC" stroke-width="1"/><rect x="1074" y="571" width="55" height="55" rx="16" fill="#E8F6F2" stroke="none" stroke-width="1"/><g transform="translate(1083 579) scale(0.76)"><path d="M 6 22 L 6 45 L 44 45 L 44 22 M 3 22 L 9 6 L 41 6 L 47 22 Z M 17 45 L 17 30 L 31 30 L 31 45 M 13 6 L 10 22 M 25 6 L 25 22 M 37 6 L 40 22" fill="none" stroke="#13A6A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1144" y="609" font-size="29" font-weight="650" fill="#142F48" text-anchor="start">DCC 承接</text><text x="1078" y="667" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">衔接邀约与到店</text><rect x="64" y="484" width="204" height="42" rx="21" fill="#E8F6F2" stroke="none" stroke-width="1"/><text x="166.0" y="513" font-size="24" font-weight="600" fill="#13A6A2" text-anchor="middle">新增的需求入口</text><text x="293" y="514" font-size="24" font-weight="400" fill="#5E7587" text-anchor="start">覆盖尚未通过垂直媒体主动留资的需求场景</text><rect x="64" y="754" width="1272" height="62" rx="18" fill="url(#tealGrad)" stroke="none" stroke-width="1"/><text x="700" y="795" font-size="28" font-weight="600" fill="#142F48" text-anchor="middle">扩大线索入口  ·  补充销售触达  ·  衔接 DCC 邀约承接</text></g></svg>